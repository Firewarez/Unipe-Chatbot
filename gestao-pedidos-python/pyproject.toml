[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gestao-pedidos-python"
version = "0.1.0"
description = "Projeto demonstrativo em Python para arquitetura de microsservicos."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "pymssql>=2.3.0",
  "redis>=5.0.0",
  "aio-pika>=9.4.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.14.0",
  "testcontainers[redis,rabbitmq]>=4.7.0"
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "services/pedidos",
  "services/catalogo",
  "services/notificacoes",
  "services/gateway"
]
markers = [
  "integration: testes que dependem de servicos externos ou Testcontainers"
]

